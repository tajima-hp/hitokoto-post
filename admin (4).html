<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ひとこと、ポスト。集計（担当者用）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBF8F2;color:#4A3426;font-family:'Zen Maru Gothic',sans-serif;line-height:1.8}
.hand{font-family:Yomogi,'Zen Maru Gothic',sans-serif;font-weight:400}
.wrap{max-width:860px;margin:0 auto;padding:44px 20px 56px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.3}
h2{margin:0;font-size:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.meta{margin:0;font-size:14px}
.panel{background:#fff;border:3px solid #F6D5CC;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px}
.login{max-width:480px;margin:0 auto;width:100%}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:15px;font-weight:700}
input[type=password]{height:48px;padding:0 16px;border:2px solid #8F7A63;border-radius:24px;font:inherit;font-size:16px;color:#4A3426;background:#FFFDF9}
.btn{height:50px;padding:0 28px;border:0;border-radius:25px;background:#B5543C;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn2{height:40px;padding:0 18px;border:2px solid #B5543C;border-radius:20px;background:#fff;color:#B5543C;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn:disabled{cursor:default;opacity:.6}
input:focus-visible,.btn:focus-visible,.btn2:focus-visible{outline:3px solid #4A3426;outline-offset:2px}
.err{margin:0;min-height:22px;font-size:14px;color:#A23B25}
.note{margin:0;padding:12px 16px;border-radius:16px;background:#FFF3D6;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{flex:1 1 150px;padding:16px 18px;border-radius:22px;background:#fff;border:3px solid #F6D5CC}
.stat p{margin:0;font-size:14px}
.stat b{display:block;font-size:34px;line-height:1.3}
.stat small{font-size:15px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:14px}
.sw{display:inline-block;width:14px;height:14px;margin-right:6px;border-radius:50%;border:1.5px solid #8F7A63;vertical-align:-2px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:12px;font-size:15px}
.track{height:26px;border-radius:13px;background:#F3EEE4;overflow:hidden;display:flex}
.seg{height:100%;border-right:1.5px solid #8F7A63}
.seg:last-child{border-right:0}
.num{text-align:right;font-weight:700}
.num span{font-weight:400;font-size:13px}
.mrow{grid-template-columns:76px 1fr 44px}
@media (max-width:560px){.bar{grid-template-columns:1fr 64px;gap:4px 10px}.bar .lab{grid-column:1/-1}.mrow{grid-template-columns:70px 1fr 40px}.mrow .lab{grid-column:auto}}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px}
select{max-width:100%;padding:10px 16px;border:2px solid #8F7A63;border-radius:18px;background:#fff;font:inherit;color:inherit}
select:focus-visible{outline:3px solid #4A3426;outline-offset:2px}
.period{margin:12px 0 0;font-weight:700}
@page{size:A4 portrait;margin:15mm}
@media print{
body{background:#fff;color:#222;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap{max-width:none;padding:0;display:block}
#login,.actions,.filters{display:none!important}
h1{font-size:24pt}h2{font-size:16pt}
.panel{padding:18px;border-width:1px;border-radius:12px;break-inside:avoid}
.stat{border-width:1px;break-inside:avoid}.stat b{font-size:26pt}
.bar{break-inside:avoid}.note{border:1px solid #888}
}
.clist{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.ci{padding:14px 16px;border-radius:18px;background:#FFFDF9;border:2px solid #F3EEE4}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:6px;font-size:13px}
.chip{padding:1px 12px;border-radius:12px;border:1.5px solid #8F7A63}
.ct{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.ci{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ci input{width:22px;height:22px;margin-top:2px;accent-color:#B5543C;flex:none;cursor:pointer}
.ci .body{flex:1;min-width:0}
.ci.on{border-color:#B5543C;background:#FFF6F2}
.inc{display:flex;align-items:center;gap:8px;font-size:14px}
.inc input{width:18px;height:18px;accent-color:#B5543C}
.phead,#psec{display:none}
@media print{
body{color:#000;font-size:10.5pt;line-height:1.6}
.phead{display:block;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid #000}
.phead h1{font-size:20pt;margin:0}
.phead p{margin:2px 0 0;font-size:11pt}
.top{display:none!important}
.period{display:none}
#csec{display:none!important}
.panel{border:1px solid #666;margin-top:14px!important;padding:14px;gap:10px}
.stats{margin-top:14px!important}
.stat{border:1px solid #666;padding:8px 12px}
.stat b{font-size:22pt}
.track{background:#fff;border:1px solid #666}
.nosum .stats,.nosum .sumpanel{display:none!important}
.nocom #psec{display:none!important}
#psec.has{display:block;margin-top:16px}
#psec h2{font-size:14pt;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #000}
.pi{padding:9px 0;border-bottom:1px solid #aaa;break-inside:avoid}
.pi .ph{font-size:9.5pt;margin-bottom:2px}
.pi .ph b{border:1px solid #000;border-radius:8px;padding:0 8px;margin-right:8px;font-weight:500}
.pi .pt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11pt}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">

<form class="panel login" id="login" novalidate>
<h1 class="hand">集計を見る</h1>
<p class="meta">担当者の方のみご利用いただけます。パスワードを入力してください。</p>
<div class="field">
<label for="pw">パスワード</label>
<input id="pw" type="password" autocomplete="current-password" aria-describedby="err">
<p class="err" id="err" role="alert"></p>
</div>
<button class="btn" type="submit" id="go">集計を表示する</button>
</form>

<div id="view" hidden>
<div class="phead"><h1 class="hand">ひとこと、ポスト。集計</h1><p id="pperiod"></p><p id="pdate"></p></div>
<div class="top">
<div>
<h1 class="hand">ひとこと、ポスト。集計</h1>
<p class="meta" id="upd"></p>
</div>
<div class="actions">
<button class="btn2" type="button" id="reload">最新の情報に更新</button>
<button class="btn2" type="button" id="out">閉じる</button>
</div>
</div>
<p class="note" id="demo" hidden>サンプルの数字を表示しています（ENDPOINT が未設定のため）。実際の投稿は反映されていません。</p>

<div class="filters">
<label for="monthFilter">集計する月</label>
<select id="monthFilter"><option value="">全期間</option></select>
<button class="btn2" type="button" id="print">集計を印刷</button>
</div>
<p class="period" id="period" aria-live="polite"></p>
<div class="stats" id="stats" style="margin-top:28px"></div>

<section class="panel sumpanel" style="margin-top:28px;border-color:#D6E6EE">
<h2 class="hand">種類別の件数</h2>
<div class="bars" id="kinds"></div>
</section>

<section class="panel sumpanel" style="margin-top:28px;border-color:#DCE8D0">
<h2 class="hand">月別の件数</h2>
<ul class="legend" id="legend"></ul>
<div class="bars" id="months"></div>
</section>

<section class="panel" id="csec" style="margin-top:28px;border-color:#F8E6BC">
<h2 class="hand">投稿されたコメント</h2>
<p class="meta">印刷したいコメントにチェックを入れてください。</p>
<div class="cbar">
<label for="kindFilter">種類</label>
<select id="kindFilter"><option value="">すべて</option></select>
<span id="ccount" aria-live="polite"></span>
</div>
<div class="cbar">
<button class="btn2" type="button" id="pickAll">表示中をすべて選ぶ</button>
<button class="btn2" type="button" id="pickNone">選択をすべて外す</button>
<span id="pcount" class="meta" aria-live="polite"></span>
</div>
<div class="cbar">
<button class="btn" type="button" id="print2" style="height:44px">選んだコメントを印刷</button>
</div>
<p class="note" id="cnote" hidden>コメント本文がまだ届いていません。Apps Script 側で、集計の返り値に comments を加えてください。</p>
<ul class="clist" id="clist"></ul>
</section>
<section id="psec"><h2 class="hand">投稿されたコメント</h2><div id="plist"></div></section>
</div>

</main>

<script>
// ▼ Apps Script を「ウェブアプリ」としてデプロイしたあとに発行されるURLを、ここに貼ります（index.html と同じURL）
var ENDPOINT = 'ここにウェブアプリのURLを貼る';

var KINDS = [
  { n: 'ありがとうの声', c: '#F6D5CC' },
  { n: '気になったこと', c: '#D6E6EE' },
  { n: 'こうなったらいいな', c: '#DCE8D0' },
  { n: 'その他', c: '#F8E6BC' }
];
var $ = function (id) { return document.getElementById(id); };
var summary = null;
var picked = {}; // 選んだコメント（画面を閉じるまで）
(function () {
  KINDS.forEach(function (k) { var o = el('option', '', k.n); o.value = k.n; $('kindFilter').appendChild(o); });
})();
var password = ''; // 画面を閉じるまでメモリ上だけに保持します（保存はしません）

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function sample() {
  var months = [], now = new Date();
  for (var i = 11; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var k = {}, t = 0;
    KINDS.forEach(function (x, j) { k[x.n] = (j * 3 + i * 2) % 7 + 1; t += k[x.n]; });
    months.push({ month: d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2), total: t, kinds: k });
  }
  var kinds = {}, total = 0;
  months.forEach(function (m) { KINDS.forEach(function (x) { kinds[x.n] = (kinds[x.n] || 0) + m.kinds[x.n]; }); total += m.total; });
  var texts = ['いつも丁寧に対応していただき、ありがとうございます。', '入口の段差が少し気になりました。', '待合のいすをもう少し増やしてもらえるとうれしいです。', 'その他、特にありません。'];
  var comments = [];
  months.slice(-3).forEach(function (m, i) {
    KINDS.forEach(function (x, j) { comments.push({ date: m.month + '-' + ('0' + (5 + j * 5)).slice(-2) + ' 10:' + ('0' + (i * 7 + j)).slice(-2), month: m.month, kind: x.n, text: texts[j] }); });
  });
  return { ok: true, total: total, kinds: kinds, months: months, comments: comments, updated: '（サンプル）' };
}

function fetchSummary() {
  if (ENDPOINT.indexOf('http') !== 0) return Promise.resolve(sample());
  return fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'summary', password: password })
  }).then(function (r) { return r.json(); });
}

function pct(n, total) { return total ? Math.round(n / total * 100) : 0; }

function monthLabel(m) {
  var p = m.split('-'); return p[0] + '年' + Number(p[1]) + '月';
}
function setSummary(d) {
  summary = d;
  var selected = $('monthFilter').value;
  $('monthFilter').textContent = '';
  var all = el('option', '', '全期間'); all.value = ''; $('monthFilter').appendChild(all);
  (d.months || []).slice().sort(function(a,b){return b.month.localeCompare(a.month);}).forEach(function(m){
    var option = el('option', '', monthLabel(m.month)); option.value = m.month; $('monthFilter').appendChild(option);
  });
  $('monthFilter').value = Array.from($('monthFilter').options).some(function(o){return o.value === selected;}) ? selected : '';
  render(d);
}
function render(d) {
  var selected = $('monthFilter').value;
  var displayed = (d.months || []).filter(function(m){return !selected || m.month === selected;});
  var chosen = selected ? displayed[0] : d;
  var total = chosen ? Number(chosen.total) || 0 : 0;
  var kinds = chosen && chosen.kinds || {};
  $('period').textContent = '集計対象：' + (selected ? monthLabel(selected) : '全期間') + ' ／ ' + total + '件';
  $('upd').textContent = '最終更新：' + d.updated;
  $('demo').hidden = ENDPOINT.indexOf('http') === 0;

  var now = new Date();
  var currentKey = now.getFullYear() + '-' + ('0' + (now.getMonth()+1)).slice(-2);
  var prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  var prevKey = prevDate.getFullYear() + '-' + ('0' + (prevDate.getMonth()+1)).slice(-2);
  function count(key){var m = (d.months || []).find(function(m){return m.month === key;}); return m ? m.total : '—';}
  var stats = $('stats'); stats.textContent = '';
  var cards = selected ? [[monthLabel(selected) + 'の合計', total]] : [['これまでの合計', total], ['今月', count(currentKey)], ['先月', count(prevKey)]];
  cards.forEach(function (s) {
    var box = el('div', 'stat'); box.appendChild(el('p', '', s[0]));
    var b = el('b', 'hand', String(s[1])); b.appendChild(el('small', '', ' 件'));
    box.appendChild(b); stats.appendChild(box);
  });

  var kb = $('kinds'); kb.textContent = '';
  KINDS.forEach(function (k) {
    var n = kinds[k.n] || 0, row = el('div', 'bar');
    row.appendChild(el('span', 'lab', k.n));
    var track = el('div', 'track'), seg = el('div', 'seg');
    seg.style.width = pct(n, total) + '%'; seg.style.background = k.c;
    track.appendChild(seg); row.appendChild(track);
    var num = el('span', 'num', n + ' 件 '); num.appendChild(el('span', '', '（' + pct(n, total) + '%）'));
    row.appendChild(num); kb.appendChild(row);
  });

  var lg = $('legend'); lg.textContent = '';
  KINDS.forEach(function (k) {
    var li = el('li'), sw = el('span', 'sw'); sw.style.background = k.c;
    li.appendChild(sw); li.appendChild(document.createTextNode(k.n)); lg.appendChild(li);
  });

  var max = Math.max.apply(null, displayed.map(function (m) { return m.total; }).concat([1]));
  var mb = $('months'); mb.textContent = '';
  displayed.forEach(function (m) {
    var row = el('div', 'bar mrow'), p = m.month.split('-');
    row.appendChild(el('span', 'lab', p[0] + '年' + Number(p[1]) + '月'));
    var track = el('div', 'track');
    KINDS.forEach(function (k) {
      var n = m.kinds[k.n] || 0; if (!n) return;
      var seg = el('div', 'seg'); seg.style.width = (n / max * 100) + '%'; seg.style.background = k.c;
      seg.title = k.n + '：' + n + '件'; track.appendChild(seg);
    });
    row.appendChild(track); row.appendChild(el('span', 'num', m.total + ' 件'));
    mb.appendChild(row);
  });
  renderComments(d, selected);
}

function ckey(c) { return [c.date, c.kind, c.text].join('|'); }
function cmonth(c) { return c.month || String(c.date || '').slice(0, 7); }
function byDate(a, b) { return String(b.date).localeCompare(String(a.date)); }

function renderComments(d, selected) {
  var list = $('clist'); list.textContent = '';
  var has = Array.isArray(d.comments);
  $('cnote').hidden = has;
  var kind = $('kindFilter').value;
  var items = (has ? d.comments : []).filter(function (c) {
    return (!selected || cmonth(c) === selected) && (!kind || c.kind === kind);
  }).sort(byDate);
  $('ccount').textContent = has ? items.length + '件' : '';
  if (has && !items.length) { list.appendChild(el('li', 'meta', '該当するコメントはありません。')); }
  items.forEach(function (c) {
    var key = ckey(c), li = el('li', 'ci'), lab = el('label'), cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!picked[key];
    li.className = 'ci' + (cb.checked ? ' on' : '');
    cb.setAttribute('aria-label', (c.date || '') + ' のコメントを印刷に含める');
    cb.addEventListener('change', function () {
      if (cb.checked) picked[key] = 1; else delete picked[key];
      li.classList.toggle('on', cb.checked); buildPrint();
    });
    var body = el('div', 'body'), h = el('div', 'ch'), chip = el('span', 'chip', c.kind || 'その他');
    KINDS.forEach(function (k) { if (k.n === c.kind) chip.style.background = k.c; });
    h.appendChild(chip); h.appendChild(el('span', '', String(c.date || '')));
    body.appendChild(h); body.appendChild(el('p', 'ct', String(c.text || '')));
    li.appendChild(cb); li.appendChild(body);
    li.addEventListener('click', function (e) { if (e.target !== cb) { cb.click(); } });
    list.appendChild(li);
  });
  buildPrint();
}

// 印刷用：選んだコメントのうち、いま選んでいる月のものを並べます
function printable() {
  if (!summary || !Array.isArray(summary.comments)) return [];
  var sel = $('monthFilter').value;
  return summary.comments.filter(function (c) { return picked[ckey(c)] && (!sel || cmonth(c) === sel); }).sort(byDate);
}
function buildPrint() {
  var items = printable(), box = $('plist'); box.textContent = '';
  items.forEach(function (c) {
    var row = el('div', 'pi'), h = el('div', 'ph');
    h.appendChild(el('b', '', c.kind || 'その他')); h.appendChild(document.createTextNode(String(c.date || '')));
    row.appendChild(h); row.appendChild(el('p', 'pt', String(c.text || ''))); box.appendChild(row);
  });
  $('psec').classList.toggle('has', items.length > 0);
  $('pcount').textContent = '印刷するコメント：' + items.length + '件';
}
function doPrint(mode) {
  if (!summary || $('view').hidden) return;
  if (mode === 'comments' && !printable().length) { alert('印刷するコメントにチェックを入れてください。'); return; }
  var v = $('view');
  v.classList.toggle('nosum', mode === 'comments');
  v.classList.toggle('nocom', mode !== 'comments');
  $('pperiod').textContent = $('period').textContent;
  var n = new Date();
  $('pdate').textContent = '印刷日：' + n.getFullYear() + '年' + (n.getMonth() + 1) + '月' + n.getDate() + '日　／　' + $('upd').textContent;
  window.print();
}

function load(btn, label) {
  var err = $('err'); err.textContent = '';
  btn.disabled = true; btn.textContent = '読み込み中…';
  return fetchSummary().then(function (d) {
    if (d && d.ok) {
      $('login').hidden = true; $('view').hidden = false; $('pw').value = ''; setSummary(d); return;
    }
    $('view').hidden = true; $('login').hidden = false; password = '';
    err.textContent = d && d.error === 'locked'
      ? '入力の誤りが続いたため、しばらく入力できません。時間をおいてからお試しください。'
      : 'パスワードが違います。もう一度ご確認ください。';
    $('pw').focus();
  }).catch(function () {
    err.textContent = '読み込めませんでした。通信状況をご確認のうえ、もう一度お試しください。';
    $('login').hidden = false;
  }).then(function () { btn.disabled = false; btn.textContent = label; });
}

$('login').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('pw').value;
  if (!v) { $('err').textContent = 'パスワードを入力してください。'; $('pw').focus(); return; }
  password = v; load($('go'), '集計を表示する');
});
$('kindFilter').addEventListener('change', function(){if(summary) render(summary);});
$('monthFilter').addEventListener('change', function(){if(summary) render(summary);});
$('print').addEventListener('click', function(){doPrint('summary');});
$('print2').addEventListener('click', function(){doPrint('comments');});
$('pickAll').addEventListener('click', function () {
  Array.prototype.forEach.call($('clist').querySelectorAll('input[type=checkbox]'), function (cb) { if (!cb.checked) cb.click(); });
});
$('pickNone').addEventListener('click', function () { picked = {}; if (summary) renderComments(summary, $('monthFilter').value); });
$('reload').addEventListener('click', function () { load($('reload'), '最新の情報に更新'); });
$('out').addEventListener('click', function () {
  summary = null; picked = {}; password = ''; $('pw').value = ''; $('stats').textContent = ''; $('kinds').textContent = ''; $('months').textContent = ''; $('clist').textContent = ''; $('view').hidden = true; $('login').hidden = false; $('pw').focus();
});
</script>
</body>
</html>
